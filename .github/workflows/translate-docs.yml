name: Sync English docs

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '**.MD'
      - '**.mD'
      - '**.Md'
      - '!translations/**'
      - '!_sidebar.en.md'
      - scripts/translate_docs.py
      - scripts/test_translate_docs.py
      - scripts/translation-glossary.md
      - scripts/translation-requirements.txt
      - .github/workflows/translate-docs.yml
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate all managed English documents
        type: boolean
        default: false

concurrency:
  group: english-docs
  cancel-in-progress: false

jobs:
  translate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up documentation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/translation-requirements.txt

      - name: Install translation dependencies
        run: python -m pip install -r scripts/translation-requirements.txt

      - name: Test translation safeguards
        run: python scripts/test_translate_docs.py

      - name: Reuse translations from an open translation PR
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/codex/english-docs; then
            git archive origin/codex/english-docs -- translations/en/ | tar -x
          fi

      - name: Restore checkpoints from the latest completed run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p .translation-checkpoints
          while read -r checkpoint_run; do
            checkpoint_artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$checkpoint_run/artifacts" \
              --jq '.artifacts | map(select(.expired == false and (.name | startswith("english-docs-checkpoints-")))) | max_by(.created_at).name // empty')
            if [[ -n "$checkpoint_artifact" ]] && gh run download "$checkpoint_run" \
              --repo "$GITHUB_REPOSITORY" --name "$checkpoint_artifact" --dir .translation-checkpoints; then
              echo "Restored translation checkpoints from run $checkpoint_run"
              break
            fi
          done < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow translate-docs.yml \
            --branch main --status completed --limit 20 --json databaseId --jq '.[].databaseId')

      - name: Translate and validate English docs
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          PYTHONIOENCODING: utf-8
          FORCE: ${{ inputs.force || false }}
        shell: bash
        run: |
          for name in DEEPSEEK_API_KEY DEEPSEEK_BASE_URL DEEPSEEK_MODEL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          base = os.environ["DEEPSEEK_BASE_URL"].strip().rstrip("/")
          for value in (base, urlsplit(base).hostname, os.environ["DEEPSEEK_MODEL"].strip()):
              if value:
                  escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::add-mask::" + escaped)
          PY
          args=()
          if [[ "$FORCE" == "true" ]]; then
            args+=(--force)
          fi
          python scripts/translate_docs.py --checkpoint-dir .translation-checkpoints --probe \
            '1-3-RAG、微调、续训与智能体选型.md' \
            '13-提示词与消息模板.md' \
            '29-微调数据准备与对话模板.md'
          python scripts/translate_docs.py --checkpoint-dir .translation-checkpoints "${args[@]}"
          python scripts/translate_docs.py --check
          git diff --exit-code -- . ':(exclude)translations/en/**' ':(exclude)_sidebar.en.md'

      - name: Create or update translation PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: codex/english-docs
          base: main
          title: 'docs: sync English translations'
          commit-message: 'docs: sync English translations'
          body: |
            Sync all Git-tracked Markdown documents and the English website sidebar.
            New and changed documents are translated; unchanged translations are reused.
            Code, document structure, links, source freshness and language navigation were checked.
            Please review the English wording before merging.
          add-paths: |
            translations/en/
            _sidebar.en.md
          delete-branch: true

      - name: Save validated checkpoints even when translation fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: english-docs-checkpoints-${{ github.run_id }}-${{ github.run_attempt }}
          path: .translation-checkpoints/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
